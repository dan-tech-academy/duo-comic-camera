name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit & widget tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duo-comic-camera-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

# Note: integration_test/ intentionally not run on CI — nó cần emulator có
# cả camera trước lẫn sau. Chạy local: flutter test integration_test -d <device>
